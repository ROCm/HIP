<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
    <!-- Background -->
    <rect width="600" height="300" fill="#2D2D2D"/>
    
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="white" font-family="Arial" font-size="18">CPU vs GPU Architecture</text>
    
    <!-- CPU Section -->
    <g transform="translate(50, 60)">
        <!-- CPU Title -->
        <text x="120" y="20" text-anchor="middle" fill="white" font-family="Arial" font-size="16">CPU</text>
        
        <!-- CPU Diagram -->
        <rect x="20" y="30" width="200" height="150" fill="#2D2D2D" stroke="white" stroke-width="2"/>
        
        <!-- CPU Cores (few but large) -->
        <rect x="35" y="45" width="70" height="55" fill="#8B1538" stroke="white" stroke-width="1"/>
        <rect x="135" y="45" width="70" height="55" fill="#8B1538" stroke="white" stroke-width="1"/>
        <rect x="35" y="110" width="70" height="55" fill="#8B1538" stroke="white" stroke-width="1"/>
        <rect x="135" y="110" width="70" height="55" fill="#8B1538" stroke="white" stroke-width="1"/>
        
        <!-- Labels -->
        <text x="120" y="200" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Large Complex Cores</text>
        <text x="120" y="220" text-anchor="middle" fill="white" font-family="Arial" font-size="12">High Clock Speed (3-5 GHz)</text>
    </g>
    
    <!-- GPU Section -->
    <g transform="translate(330, 60)">
        <!-- GPU Title -->
        <text x="120" y="20" text-anchor="middle" fill="white" font-family="Arial" font-size="16">GPU</text>
        
        <!-- GPU Diagram -->
        <rect x="20" y="30" width="200" height="150" fill="#2D2D2D" stroke="white" stroke-width="2"/>
        
        <!-- GPU Cores (many but small) -->
        <g id="gpu-core-row">
            <rect x="30" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="55" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="80" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="105" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="130" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="155" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
            <rect x="180" y="45" width="15" height="15" fill="#8B1538" stroke="white" stroke-width="1"/>
        </g>
        
        <!-- Copy rows -->
        <use href="#gpu-core-row" y="25"/>
        <use href="#gpu-core-row" y="50"/>
        <use href="#gpu-core-row" y="75"/>
        <use href="#gpu-core-row" y="100"/>
        <use href="#gpu-core-row" y="125"/>
        
        <!-- Labels -->
        <text x="120" y="200" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Many Simple Cores</text>
        <text x="120" y="220" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Lower Clock Speed (1-2 GHz)</text>
    </g>

    <!-- Memory Hierarchy -->
    <g transform="translate(50, 250)">
        <!-- CPU Cache -->
        <rect x="20" y="0" width="200" height="20" fill="#444444" stroke="white" stroke-width="1"/>
        <text x="120" y="14" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Large Cache per Core</text>
    </g>
    
    <g transform="translate(330, 250)">
        <!-- GPU Memory -->
        <rect x="20" y="0" width="200" height="20" fill="#444444" stroke="white" stroke-width="1"/>
        <text x="120" y="14" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Shared Memory across Cores</text>
    </g>
</svg>
